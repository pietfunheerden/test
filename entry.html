<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Adventure Planner</title><link rel="stylesheet" href="css/styles.css"></head><body>
<div id="s-hike-entry" class="screen">
  <button class="entry-back" onclick="showHub()">← Back</button>
  <div class="entry-bg" id="entry-bg"></div>
  <div class="entry-overlay"></div>
  <div class="entry-mist"></div>
  <div class="entry-particles" id="entry-particles"></div>
  <div class="entry-content">
    <div class="entry-badge" id="entry-badge"></div>
    <div class="entry-name" id="entry-name"></div>
    <div class="entry-loc" id="entry-loc"></div>
    <div class="entry-dates" id="entry-dates"></div>
    <div class="entry-fams" id="entry-fams"></div>
    <div class="weather-strip" id="entry-weather"></div>
    <button class="entry-btn" onclick="enterHike()">🏔️ Enter Adventure</button>
  </div>
</div>
<div class="toast" id="toast"></div>
<script type="module" src="js/app.js"></script>
</body></html>
