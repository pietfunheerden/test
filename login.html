<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Adventure planner</title><link rel="stylesheet" href="css/styles.css"></head><body>
<div id="s-login" class="screen active">
  <div class="login-sky"></div>
  <div class="login-stars" id="login-stars"></div>
  <div class="mist-layer mist1"></div>
  <div class="mist-layer mist2"></div>
  <div class="login-content">
    <div style="text-align:center;margin-bottom:8px">
      <div class="login-logo">🏕️</div>
      <div style="font-size:13px;color:var(--amber);font-weight:700;letter-spacing:.05em">Adventure Planner</div>
    </div>
    <div class="login-title">Pack & plan together</div>
    <div class="login-sub">Coordinate packing, meals, and questions across every family on the trip.</div>
    <button class="google-btn" onclick="if(typeof signIn==='function'){signIn()}else{alert('App still loading, please wait...')}">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="">
      Sign in with Google
    </button>
    <div class="login-note">You'll need to be invited by an admin to see your adventures.</div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script type="module" src="js/app.js"></script>
</body></html>
